[project]
name = "se-os-integrations"
version = "0.1.0"
description = "External Integrations (GitHub & LeetCode) for SE-OS"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "structlog>=24.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
