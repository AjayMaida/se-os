[project]
name = "se-os-notifications"
version = "0.1.0"
description = "Notifications worker service for SE-OS"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.5",
    "aio-pika>=9.4",
    "httpx>=0.28",
    "structlog>=24.4",
    "jinja2>=3.1",
    "pywebpush>=1.14"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "coverage>=7.6"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
