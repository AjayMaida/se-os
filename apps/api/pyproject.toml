[project]
name = "se-os-api"
version = "0.1.0"
description = "FastAPI backend for SE-OS"
authors = [{ name = "SE-OS Team" }]
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis[hiredis]>=5.2",
    "celery[redis]>=5.4",
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.28",
    "structlog>=24.4",
    "aio-pika>=9.4",
    "boto3>=1.35",
    "python-multipart>=0.0.12",
    "sentry-sdk[fastapi]>=2.18"
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "coverage"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
